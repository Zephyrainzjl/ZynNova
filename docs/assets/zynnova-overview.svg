<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ZynNova framework architecture</title>
  <desc id="desc">Layered architecture showing research workflows, the public Python API, five domain modules, shared contracts, and Python and C++ backends.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8291a8"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #102a43; }
      .tagline { font-size: 19px; font-weight: 400; fill: #52667d; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1.8px; fill: #2e6da4; }
      .layer-title { font-size: 23px; font-weight: 700; fill: #15324f; }
      .layer-body { font-size: 17px; font-weight: 400; fill: #52667d; }
      .module-title { font-size: 21px; font-weight: 700; fill: #17324d; }
      .module-body { font-size: 14.2px; font-weight: 400; fill: #4e6278; }
      .api-title { font-size: 25px; font-weight: 700; fill: #ffffff; }
      .api-body { font-size: 17px; font-weight: 400; fill: #dceaf6; }
      .backend-title { font-size: 21px; font-weight: 700; fill: #17324d; }
      .backend-body { font-size: 16px; font-weight: 400; fill: #52667d; }
      .pill { font-size: 14px; font-weight: 700; fill: #2b5f8c; }
      .connector { fill: none; stroke: #8291a8; stroke-width: 2.5; }
      .node { }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f1f5f9"/>

  <g class="sans">
    <text x="78" y="63" class="eyebrow">MATERIALS REPRESENTATION · LEARNING · SIMULATION</text>
    <text x="78" y="112" class="title">ZynNova Framework Architecture</text>
    <text x="78" y="146" class="tagline">One public Python interface across structures, data, machine learning, dynamics, and visualization.</text>

    <g transform="translate(1230,67)">
      <rect width="290" height="48" rx="24" fill="#e6f0f8" stroke="#bfd5e7"/>
      <circle cx="28" cy="24" r="8" fill="#2e78b7"/>
      <text x="48" y="30" class="pill">Python · C++17 · Materials AI</text>
    </g>

    <!-- Research workflow layer -->
    <g class="node">
      <rect x="78" y="184" width="1444" height="94" rx="18" fill="#ffffff" stroke="#b8c9da" stroke-width="1.8"/>
      <rect x="78" y="184" width="10" height="94" rx="5" fill="#4f86b8"/>
    </g>
    <text x="118" y="222" class="layer-title">Research workflows and applications</text>
    <text x="118" y="253" class="layer-body">Jupyter notebooks · Python scripts · training pipelines · screening workflows · molecular dynamics studies</text>
    <g transform="translate(1160,207)">
      <rect width="108" height="38" rx="19" fill="#eef4fa" stroke="#d3dfeb"/>
      <text x="54" y="25" text-anchor="middle" class="pill">Research</text>
      <rect x="122" width="108" height="38" rx="19" fill="#eef4fa" stroke="#d3dfeb"/>
      <text x="176" y="25" text-anchor="middle" class="pill">Training</text>
      <rect x="244" width="108" height="38" rx="19" fill="#eef4fa" stroke="#d3dfeb"/>
      <text x="298" y="25" text-anchor="middle" class="pill">Simulation</text>
    </g>

    <path d="M800 278 L800 307" class="connector" marker-end="url(#arrow)"/>

    <!-- Public API -->
    <g class="node">
      <rect x="78" y="318" width="1444" height="92" rx="18" fill="#174f7e" stroke="#123e64" stroke-width="1.5"/>
    </g>
    <text x="118" y="357" class="api-title">Public Python API</text>
    <text x="118" y="388" class="api-body">Stable imports · configuration objects · registries · validation · optional-dependency boundaries</text>
    <g transform="translate(1194,341)">
      <rect width="286" height="44" rx="22" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="143" y="28" text-anchor="middle" class="api-body">Consistent user-facing contracts</text>
    </g>

    <!-- Fan-out from API -->
    <path d="M800 410 L800 439 M218 439 L1386 439" class="connector"/>
    <path d="M218 439 L218 465 M510 439 L510 465 M802 439 L802 465 M1094 439 L1094 465 M1386 439 L1386 465" class="connector" marker-end="url(#arrow)"/>

    <!-- Structure -->
    <g class="node">
      <rect x="78" y="474" width="276" height="244" rx="18" fill="#ffffff" stroke="#b8c9da" stroke-width="1.8"/>
      <rect x="78" y="474" width="276" height="11" rx="5.5" fill="#2f7fbd"/>
    </g>
    <circle cx="118" cy="526" r="22" fill="#e3f1fb"/>
    <text x="118" y="533" text-anchor="middle" font-size="17" font-weight="700" fill="#256a9f">S</text>
    <text x="153" y="534" class="module-title">Structure</text>
    <text x="108" y="577" class="module-body">
      <tspan x="108" dy="0">Molecules · crystals · polymers</tspan>
      <tspan x="108" dy="29">Structure ↔ graph conversion</tspan>
      <tspan x="108" dy="29">Periodic neighbors and geometry</tspan>
      <tspan x="108" dy="29">ASE / PyG interoperability</tspan>
    </text>

    <!-- Data -->
    <g class="node">
      <rect x="370" y="474" width="276" height="244" rx="18" fill="#ffffff" stroke="#b8c9da" stroke-width="1.8"/>
      <rect x="370" y="474" width="276" height="11" rx="5.5" fill="#258b86"/>
    </g>
    <circle cx="410" cy="526" r="22" fill="#ddf3f0"/>
    <text x="410" y="533" text-anchor="middle" font-size="17" font-weight="700" fill="#20746f">D</text>
    <text x="445" y="534" class="module-title">Data</text>
    <text x="400" y="577" class="module-body">
      <tspan x="400" dy="0">Datasets and data sources</tspan>
      <tspan x="400" dy="29">Schemas · encoders · transforms</tspan>
      <tspan x="400" dy="29">Statistics and normalization</tspan>
      <tspan x="400" dy="29">Batching and task definitions</tspan>
    </text>

    <!-- Machine learning -->
    <g class="node">
      <rect x="662" y="474" width="276" height="244" rx="18" fill="#ffffff" stroke="#b8c9da" stroke-width="1.8"/>
      <rect x="662" y="474" width="276" height="11" rx="5.5" fill="#7656b6"/>
    </g>
    <circle cx="702" cy="526" r="22" fill="#eee8fa"/>
    <text x="702" y="533" text-anchor="middle" font-size="15" font-weight="700" fill="#6548a1">ML</text>
    <text x="737" y="534" class="module-title">Machine Learning</text>
    <text x="692" y="577" class="module-body">
      <tspan x="692" dy="0">Property prediction</tspan>
      <tspan x="692" dy="29">Conditional generation</tspan>
      <tspan x="692" dy="29">Graph neural networks</tspan>
      <tspan x="692" dy="29">ML force fields and checkpoints</tspan>
    </text>

    <!-- Dynamics -->
    <g class="node">
      <rect x="954" y="474" width="276" height="244" rx="18" fill="#ffffff" stroke="#b8c9da" stroke-width="1.8"/>
      <rect x="954" y="474" width="276" height="11" rx="5.5" fill="#d17a32"/>
    </g>
    <circle cx="994" cy="526" r="22" fill="#faecdf"/>
    <text x="994" y="533" text-anchor="middle" font-size="14" font-weight="700" fill="#b56222">MD</text>
    <text x="1029" y="534" class="module-title">Dynamics</text>
    <text x="984" y="577" class="module-body">
      <tspan x="984" dy="0">Run and safety configuration</tspan>
      <tspan x="984" dy="29">Classical and ML calculators</tspan>
      <tspan x="984" dy="29">Integrators and ensembles</tspan>
      <tspan x="984" dy="29">Trajectories and checkpoints</tspan>
    </text>

    <!-- Visualization -->
    <g class="node">
      <rect x="1246" y="474" width="276" height="244" rx="18" fill="#ffffff" stroke="#b8c9da" stroke-width="1.8"/>
      <rect x="1246" y="474" width="276" height="11" rx="5.5" fill="#4c8f5d"/>
    </g>
    <circle cx="1286" cy="526" r="22" fill="#e3f2e7"/>
    <text x="1286" y="533" text-anchor="middle" font-size="17" font-weight="700" fill="#3d784c">V</text>
    <text x="1321" y="534" class="module-title">Visualization</text>
    <text x="1276" y="577" class="module-body">
      <tspan x="1276" dy="0">Molecules · crystals · polymers</tspan>
      <tspan x="1276" dy="29">Trajectory visualization</tspan>
      <tspan x="1276" dy="29">Pluggable rendering backends</tspan>
      <tspan x="1276" dy="29">Notebook-friendly viewers</tspan>
    </text>

    <!-- Convergence to shared contracts -->
    <path d="M218 718 L218 746 M510 718 L510 746 M802 718 L802 746 M1094 718 L1094 746 M1386 718 L1386 746 M218 746 L1386 746 M800 746 L800 769" class="connector" marker-end="url(#arrow)"/>

    <!-- Shared contracts -->
    <g class="node">
      <rect x="78" y="779" width="1444" height="90" rx="18" fill="#e7eef5" stroke="#b4c6d8" stroke-width="1.8"/>
    </g>
    <text x="118" y="817" class="layer-title">Shared representations and extension contracts</text>
    <text x="118" y="848" class="layer-body">StructureData · GraphData · PolymerRecord · units · metadata · validation · registries · workspace and checkpoint conventions</text>

    <!-- Split to implementation backends -->
    <path d="M800 869 L800 892 M430 892 L1170 892 M430 892 L430 915 M1170 892 L1170 915" class="connector" marker-end="url(#arrow)"/>

    <!-- Backends -->
    <g class="node">
      <rect x="78" y="925" width="702" height="60" rx="17" fill="#ffffff" stroke="#b8c9da" stroke-width="1.8"/>
      <rect x="78" y="925" width="8" height="60" rx="4" fill="#4f86b8"/>
    </g>
    <text x="112" y="951" class="backend-title">Python scientific ecosystem</text>
    <text x="112" y="975" class="backend-body">NumPy · ASE · PyTorch · PyTorch Geometric · RDKit</text>

    <g class="node">
      <rect x="820" y="925" width="702" height="60" rx="17" fill="#ffffff" stroke="#b8c9da" stroke-width="1.8"/>
      <rect x="820" y="925" width="8" height="60" rx="4" fill="#376887"/>
    </g>
    <text x="854" y="951" class="backend-title">Native C++17 acceleration</text>
    <text x="854" y="975" class="backend-body">Graph and neighbor kernels · pybind11 · CMake · scikit-build-core</text>
  </g>
</svg>
