[build-system]
requires = [
  "scikit-build-core>=0.11",
  "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "zynnova"
version = "0.3.0"
description = "An extensible Python/C++ framework for materials intelligence, simulation, 3D/world generation, speech workflows, and provider-neutral LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT for original ZynNova code; AGPL-3.0-or-later for the linked TetGen component" }
authors = [{ name = "Jialiu Zeng" }]
keywords = [
  "materials",
  "datasets",
  "crystal",
  "molecule",
  "polymer",
  "graph",
  "molecular-dynamics",
  "density-functional-theory",
  "machine-learning",
  "finite-elements",
  "lithium-ion-battery",
  "battery-aging",
  "electrochemical-impedance",
  "digital-twin",
  "multiscale-simulation",
  "uncertainty-quantification",
  "physics-discovery",
  "symbolic-regression",
  "3d-reconstruction",
  "image-to-3d",
  "microstructure-generation",
  "tetrahedral-meshing",
  "voice-conversion",
  "speech-synthesis",
  "voice-cloning",
  "large-language-models",
  "agents",
  "mcp",
  "skills",
  "world-generation",
  "gaussian-splatting",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
]

