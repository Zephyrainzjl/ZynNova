[project.scripts]
zynnova = "zynnova.cli:main"
zynnova-llm = "zynnova.llm.zynastra.cli:main"
zynvox-studio = "zynnova.zynvox.studio.cli:main"


[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["src/zynnova"]
build-dir = "build/{wheel_tag}"
minimum-version = "build-system.requires"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
  "experiment: numerical experiment requiring torch and e3nn",
  "lammps: integration test requiring a LAMMPS Python build",
  "slow: real second-order energy/force training smoke tests",
  "gpu: CUDA/CuEq parity or performance test",
  "benchmark: hardware-specific latency regression test",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
